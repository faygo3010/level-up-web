services:
  - type: web
    name: levelup-landing
    runtime: static
    # Repo root that contains index.html. If you push this `site` folder
    # as the repo root, leave staticPublishPath as "."
    staticPublishPath: .
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=3600
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # The Level Up app itself (React PWA in app/).
  - type: web
    name: levelup-app
    runtime: static
    rootDir: app
    buildCommand: npm ci && npm test && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true
    envVars:
      # Set these in the Render dashboard (values from Supabase > Project Settings > API).
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
