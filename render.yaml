services:
  - type: web
    name: levelup-landing
    runtime: static
    # Repo root that contains index.html. If you push this `site` folder
    # as the repo root, leave staticPublishPath as "."
    staticPublishPath: .
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=3600
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # The Level Up app itself (React PWA in app/).
  - type: web
    name: levelup-app
    runtime: static
    rootDir: app
    buildCommand: npm ci && npm test && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true
    envVars:
      # Set these in the Render dashboard (values from Supabase > Project Settings > API).
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_CONNECTOR_URL
        sync: false # e.g. https://levelup-connector.onrender.com
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # The Level Up connector: lets AI chat apps (Claude, ChatGPT, ...) use a
  # Level Up account over MCP. Must stay awake, so use a paid instance.
  - type: web
    name: levelup-connector
    runtime: node
    rootDir: server
    plan: starter
    # --include=dev: NODE_ENV=production would otherwise skip the test and build tools.
    buildCommand: npm ci --include=dev && npm --prefix ../app ci --include=dev && npm test && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUBLIC_URL
        sync: false # e.g. https://levelup-connector.onrender.com
      - key: APP_ORIGINS
        sync: false # e.g. https://levelup-app.onrender.com
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false # SECRET. Server only. Never put this in the app.
